# Stage 2: Vidarc causal training - optimized for 8x H200 (120GB each)
# Model: WanModelCausal
# Loss: Causal flow matching + embodiment-aware
#
# Environment variables (set before training):
#   export NCCL_TIMEOUT=1800                    # Increase NCCL timeout during debugging
#   export NCCL_IB_DISABLE=0                    # Enable InfiniBand for better performance
#   export NCCL_P2P_LEVEL=NVL                   # Better NCCL performance for 8 GPUs
#   export TORCH_DYNAMO_CACHE_SIZE_LIMIT=128     # Increase dynamo cache for flex_attention shapes

model:
  ckpt_dir: checkpoints/Wan2.2-TI2V-5B
  pt_dir: checkpoints/vidar/vidarc.pt
  model_class: WanModelCausal
  gradient_checkpointing: false

training:
  num_steps: 4000
  batch_size: 1                   # 1 per GPU
  gradient_accumulation: 8          # Effective batch = 64 (8 GPUs x 1 x 8)
  lr: 2.0e-5
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.999
  epsilon: 1.0e-8
  warmup_steps: 100
  scheduler: cosine
  freeze:
    - t5
    - vae

data:
  data_dir: data/robotwin
  num_frames: 16
  resolution: [736, 640]
  fps: 10
  num_workers: 16
  pin_memory: true
  cfg_prob: 0.1
  prefetch_factor: 4       # Prefetch more batches
  persistent_workers: true # Keep workers alive between epochs

loss:
  type: causal_flow_matching
  embodiment_aware: true
  eta: 3.0

self_forcing:
  enabled: true
  causal: true
  chunk_size: 1                     # Reduced from 16 for memory
  kv_cache_length: 64
  same_step_across_blocks: true

distributed:
  use_fsdp: true
  sharding_strategy: FULL_SHARD     # Max memory efficiency
  mixed_precision: bf16
  activation_checkpointing: false
  cpu_offload: true                 # Enable to reduce GPU memory

logging:
  output_dir: outputs/vidarc_8xh200
  log_interval: 2
  save_interval: 50
  eval_interval: 1000
  use_wandb: true
  wandb_project: vidarc-training

output:
  save_path: checkpoints/vidar/vidarc.pt
  save_optimizer: true
  save_scheduler: true

seed: 42

