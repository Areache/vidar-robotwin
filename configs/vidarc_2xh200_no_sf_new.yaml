# Stage 2: Vidarc causal training - optimized for 2x H200 (120GB each)
# Model: WanModelCausal
# Loss: Causal flow matching + embodiment-aware

model:
  ckpt_dir: checkpoints/Wan2.2-TI2V-5B
  pt_dir: checkpoints/vidar/vidar.pt
  model_class: WanModelCausal
  gradient_checkpointing: true

training:
  num_steps: 4000
  batch_size: 1                   # 1 per GPU
  gradient_accumulation: 8          # Effective batch = 16 (2 GPUs x 1 x 8)
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.999
  epsilon: 1.0e-8
  lr: 1.0e-5          # Scaled down from 4x config (2.0e-5 * 16/32 = 1.0e-5)
  warmup_steps: 30  # 200
  # min_lr: 1.2e-6          # 0.05 * lr
  scheduler: cosine
  freeze:
    - t5
    - vae

data:
  data_dir: 
    - /mnt/shared-storage-user/qinyiran/cyujie/cyujie/datasets/RoboTwin2.0/dataset/processed
    - /mnt/shared-storage-user/qinyiran/cyujie/cyujie/mounts/qinyiran/datasets/robotwin/processed
  num_frames: 40                   # Interpolated between 2x (9) and 8x (81)
  resolution: [736, 640]
  fps: 10
  num_workers: 16
  pin_memory: true
  cfg_prob: 0.1
  prefetch_factor: 8              # Prefetch more batches to hide I/O latency
  persistent_workers: true        # Keep workers alive between epochs

loss:
  type: causal_flow_matching
  embodiment_aware: true
  eta: 3.0

self_forcing:
  enabled: false                   # Disabled as requested

distributed:
  use_fsdp: true
  sharding_strategy: FULL_SHARD     # Max memory efficiency
  mixed_precision: bf16
  activation_checkpointing: true
  cpu_offload: false                # Enable if OOM

logging:
  output_dir: outputs/vidarc_2xh200
  log_interval: 2
  save_interval: 35
  eval_interval: 4000
  use_wandb: true
  wandb_project: vidarc-training
  wandb_run_id: null                    # Wandb run id to resume (null = new run)

output:
  save_path: /mnt/shared-storage-user/qinyiran/cyujie/cyujie/mounts/qinyiran/vidar/checkpoints/vidarc_2x_no_sf.pt  # Will auto-append step count: vidarc_2x_no_sf_4000.pt
  save_optimizer: true
  save_scheduler: true
  resume: null    # /mnt/shared-storage-user/qinyiran/cyujie/cyujie/code/vidar-robotwin/checkpoints/vidar/vidarc_2x_no_sf.pt                    # Path to checkpoint to resume from (null = no resume)

evaluation:                                                                                                                                                                                                                                                                     
  enabled: true                                                                                                                                                                                                                                                                
  run_after_save: false                                                                                                                                                                                                                                                         
  task_name: adjust_bottle                                                                                                                                                                                                                                                      
  task_config: hd_clean                                                                                                                                                                                                                                                         
  idm_path: /mnt/shared-storage-user/qinyiran/cyujie/cyujie/mounts/qinyiran/vidar/vidar_ckpts/idm.pt                                                                                                                                                                                                                                 
  num_new_frames: 16                                                                                                                                                                                                                                                            
  num_sampling_steps: 10                                                                                                                                                                                                                                                        
  cfg_scale: 3.0                                                                                                                                                                                                                                                                
  prefix: "" 

seed: 42
