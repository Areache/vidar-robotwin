# Stage 2: Vidarc causal training with Few-Step Diffusion & Stochastic Gradient Truncation
# Model: WanModelCausal
# Optimizations:
#   - Few-step diffusion: 10 denoising steps instead of 1000
#   - Stochastic gradient truncation: Only backprop through 1 random timestep per batch
#
# Expected speedup: 2-5x faster training compared to standard approach

model:
  ckpt_dir: checkpoints/Wan2.2-TI2V-5B
  pt_dir: checkpoints/vidar/vidar.pt
  model_class: WanModelCausal
  gradient_checkpointing: false  # Incompatible with Self-Forcing KV cache

training:
  num_steps: 4000
  batch_size: 1
  gradient_accumulation: 8          # Reduced from 32 for faster iteration
  lr: 2.0e-5
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.999
  epsilon: 1.0e-8
  warmup_steps: 200
  scheduler: cosine
  freeze:
    - t5
    - vae

data:
  data_dir: data/robotwin
  num_frames: 16
  resolution: [736, 640]
  fps: 10
  num_workers: 4                    # Increased from 2
  pin_memory: true
  cfg_prob: 0.1
  prefetch_factor: 2
  persistent_workers: true

loss:
  type: causal_flow_matching
  embodiment_aware: true
  eta: 3.0

# Few-Step Diffusion & Stochastic Gradient Truncation Configuration
diffusion:
  num_inference_steps: 10           # Few-step diffusion: only 10 denoising steps
  num_train_timesteps: 1000         # Keep at 1000 for timestep embedding compatibility

  # Stochastic Gradient Truncation
  stochastic_truncation: true       # Enable gradient truncation
  truncation_strategy: importance   # Use importance sampling for critical timesteps
  # Options: "uniform", "importance", "stratified"

  # Importance sampling parameters (only used when strategy="importance")
  importance_low_t: 0.3             # Lower bound of high importance region
  importance_high_t: 0.7            # Upper bound of high importance region
  importance_weight: 3.0            # Weight multiplier for important region

  # Gradient truncation options
  detach_kv_cache: true             # Detach KV cache from gradient graph

self_forcing:
  enabled: true
  causal: true
  chunk_size: 4                     # Increased from 1 for better efficiency
  kv_cache_length: 64
  same_step_across_blocks: true

distributed:
  use_fsdp: true
  sharding_strategy: SHARD_GRAD_OP  # Less communication overhead than FULL_SHARD
  mixed_precision: bf16
  activation_checkpointing: false   # Disabled for Self-Forcing compatibility
  cpu_offload: false                # DISABLED - this was the main bottleneck!

logging:
  output_dir: outputs/vidarc_few_step
  log_interval: 1
  save_interval: 100
  eval_interval: 500
  use_wandb: true
  wandb_project: vidarc-few-step

output:
  save_path: checkpoints/vidar/vidarc_few_step.pt
  save_optimizer: true
  save_scheduler: true

seed: 42
