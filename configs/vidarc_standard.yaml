# Vidarc Standard Training (NO Self-Forcing)
# Model: WanModelCausal
# Loss: Standard flow matching (same as Stage 1, but with causal model)
# Key: self_forcing.enabled=false allows activation_checkpointing

model:
  ckpt_dir: checkpoints/Wan2.2-TI2V-5B
  pt_dir: checkpoints/vidar/vidar.pt  # Optional: start from Stage 1 weights
  model_class: WanModelCausal
  gradient_checkpointing: true
  chunk_size: 8
  same_t_across_chunks: true

training:
  num_steps: 4000
  max_steps: 4000
  batch_size: 1
  gradient_accumulation: 8
  lr: 2.0e-5
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.999
  epsilon: 1.0e-8
  warmup_steps: 200
  scheduler: cosine
  freeze:
    - t5
    - vae
  eta: 3.0
  use_embodiment_loss: false

data:
  data_dir: data/robotwin
  dataset_type: hdf5
  num_frames: 9
  resolution: [736, 640]
  fps: 10
  num_workers: 4
  pin_memory: true
  cfg_prob: 0.1

loss:
  type: flow_matching
  embodiment_aware: false
  eta: 3.0
  lambda_mask: 0.003

# CRITICAL: Disable Self-Forcing for standard training
self_forcing:
  enabled: false    # <-- This enables activation_checkpointing compatibility
  causal: true
  chunk_size: 8
  kv_cache_length: 64
  same_step_across_blocks: true

distributed:
  use_fsdp: true
  sharding_strategy: FULL_SHARD
  mixed_precision: bf16
  activation_checkpointing: true   # <-- Now works without Self-Forcing!
  cpu_offload: false               # <-- Fast training, no cpu offload needed

logging:
  output_dir: outputs/vidarc_standard
  log_interval: 10
  save_interval: 500
  eval_interval: 1000
  use_wandb: true
  wandb_project: vidarc-training

output:
  output_dir: ./output_vidarc_standard
  save_path: checkpoints/vidar/vidarc.pt
  save_optimizer: true
  save_scheduler: true
  log_interval: 10
  save_interval: 500

seed: 42
